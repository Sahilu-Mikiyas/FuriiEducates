services:
  - type: web
    name: furii-school-api
    runtime: go
    plan: free
    rootDir: services/api
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./cmd/api
    startCommand: ./app
    healthCheckPath: /healthz
    envVars:
      - key: HTTP_ADDR
        value: :10000
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL
        value: 12h
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SESSION_HASH_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_REQUEST_ADMIN_EMAILS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: AFROMESSAGE_TOKEN
        sync: false
      - key: AFROMESSAGE_IDENTIFIER_ID
        sync: false
      - key: AFROMESSAGE_SENDER_NAME
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
