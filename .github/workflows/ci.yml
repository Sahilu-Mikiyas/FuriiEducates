name: Build and smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: furii
          POSTGRES_USER: furii
          POSTGRES_PASSWORD: furii-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U furii -d furii"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://furii:furii-ci-password@localhost:5432/furii?sslmode=disable
      SESSION_HASH_KEY: ci-only-session-hash-key-at-least-32-bytes
      HTTP_ADDR: :8080
      COOKIE_SECURE: "false"
      BOOTSTRAP_SCHOOL_NAME: FURII CI School
      BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      BOOTSTRAP_ADMIN_NAME: CI Administrator
      BOOTSTRAP_ADMIN_PASSWORD: ci-test-password-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build API
        working-directory: services/api
        run: go mod tidy && go build ./...
      - name: Apply database migrations
        working-directory: services/api
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.24.1 -dir migrations postgres "$DATABASE_URL" up
      - name: Bootstrap administrator
        working-directory: services/api
        run: go run ./cmd/bootstrap
      - name: Start API and smoke test administrator school setup
        working-directory: services/api
        run: |
          go run ./cmd/api > "$RUNNER_TEMP/furii-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://localhost:8080/healthz >/dev/null; then cat "$RUNNER_TEMP/furii-api.log"; echo '::error title=FURII smoke test::API health check failed'; exit 1; fi
          api_request() {
            method="$1"; path="$2"; payload="${3:-}"
            if [ -n "$payload" ]; then
              status=$(curl --silent --show-error -o "$RUNNER_TEMP/response.json" -w '%{http_code}' -b "$RUNNER_TEMP/cookies.txt" -c "$RUNNER_TEMP/cookies.txt" -X "$method" -H 'Content-Type: application/json' -d "$payload" "http://localhost:8080$path") || { echo "::error title=FURII smoke test::Transport failure for $method $path"; return 1; }
            else
              status=$(curl --silent --show-error -o "$RUNNER_TEMP/response.json" -w '%{http_code}' -b "$RUNNER_TEMP/cookies.txt" "http://localhost:8080$path") || { echo "::error title=FURII smoke test::Transport failure for $method $path"; return 1; }
            fi
            case "$status" in 2*) cat "$RUNNER_TEMP/response.json" ;; *) body=$(cat "$RUNNER_TEMP/response.json"); echo "::error title=FURII smoke test::$method $path returned HTTP $status: $body"; return 1 ;; esac
          }
          login=$(curl --silent --show-error -o "$RUNNER_TEMP/login.json" -w '%{http_code}' -c "$RUNNER_TEMP/cookies.txt" \
            -H 'Content-Type: application/json' -d '{"email":"admin@example.test","password":"ci-test-password-long-enough"}' http://localhost:8080/api/v1/auth/login)
          if [ "$login" != "200" ]; then body=$(cat "$RUNNER_TEMP/login.json"); echo "::error title=FURII smoke test::POST /api/v1/auth/login returned HTTP $login: $body"; exit 1; fi
          school=$(api_request GET /api/v1/school)
          if ! echo "$school" | jq -e '.data.name == "FURII CI School"'; then echo "::error title=FURII smoke test::Unexpected school response: $school"; exit 1; fi
          school=$(api_request PATCH /api/v1/school '{"name":"FURII CI School","timezone":"Africa/Addis_Ababa","default_language":"en"}')
          year=$(api_request POST /api/v1/academic-years '{"name":"2026-2027","starts_on":"2026-09-01","ends_on":"2027-07-01"}')
          if ! year_id=$(echo "$year" | jq -er '.data.id'); then echo "::error title=FURII smoke test::Unexpected academic-year response: $year"; exit 1; fi
          class=$(api_request POST /api/v1/classes "{\"name\":\"Section A\",\"grade_level\":\"9\",\"academic_year_id\":\"$year_id\"}")
          if ! class_id=$(echo "$class" | jq -er '.data.id'); then echo "::error title=FURII smoke test::Unexpected class response: $class"; exit 1; fi
          student=$(api_request POST /api/v1/students "{\"student_number\":\"CI-001\",\"legal_name\":\"Test Learner\",\"class_id\":\"$class_id\"}")
          if ! student_id=$(echo "$student" | jq -er '.data.id'); then echo "::error title=FURII smoke test::Unexpected student response: $student"; exit 1; fi
          fetched=$(api_request GET "/api/v1/students/$student_id")
          if ! echo "$fetched" | jq -e '.data.legal_name == "Test Learner"'; then echo "::error title=FURII smoke test::Unexpected student detail response: $fetched"; exit 1; fi
          updated=$(api_request PATCH "/api/v1/students/$student_id" '{"legal_name":"Test Learner Updated","preferred_language":"en","status":"active"}')
          if ! echo "$updated" | jq -e '.data.legal_name == "Test Learner Updated"'; then echo "::error title=FURII smoke test::Unexpected updated-student response: $updated"; exit 1; fi
      - name: Build web application
        working-directory: apps/web
        run: npm ci && npm run build
