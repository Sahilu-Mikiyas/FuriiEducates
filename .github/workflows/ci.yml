name: Build and smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: furii
          POSTGRES_USER: furii
          POSTGRES_PASSWORD: furii-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U furii -d furii"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://furii:furii-ci-password@localhost:5432/furii?sslmode=disable
      SESSION_HASH_KEY: ci-only-session-hash-key-at-least-32-bytes
      HTTP_ADDR: :8080
      COOKIE_SECURE: "false"
      BOOTSTRAP_SCHOOL_NAME: FURII CI School
      BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      BOOTSTRAP_ADMIN_NAME: CI Administrator
      BOOTSTRAP_ADMIN_PASSWORD: ci-test-password-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build API
        working-directory: services/api
        run: go build ./...
      - name: Apply database migrations
        working-directory: services/api
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.24.1 -dir migrations postgres "$DATABASE_URL" up
      - name: Bootstrap administrator
        working-directory: services/api
        run: go run ./cmd/bootstrap
      - name: Start API and smoke test administrator school setup
        working-directory: services/api
        run: |
          go run ./cmd/api > "$RUNNER_TEMP/furii-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://localhost:8080/healthz >/dev/null; then cat "$RUNNER_TEMP/furii-api.log"; exit 1; fi
          curl --fail --silent --show-error -c "$RUNNER_TEMP/cookies.txt" \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.test","password":"ci-test-password-long-enough"}' \
            http://localhost:8080/api/v1/auth/login > "$RUNNER_TEMP/login.json"
          curl --fail --silent --show-error -b "$RUNNER_TEMP/cookies.txt" \
            http://localhost:8080/api/v1/school | jq -e '.data.name == "FURII CI School"'
          year=$(curl --fail --silent --show-error -b "$RUNNER_TEMP/cookies.txt" \
            -H 'Content-Type: application/json' \
            -d '{"name":"2026-2027","starts_on":"2026-09-01","ends_on":"2027-07-01"}' \
            http://localhost:8080/api/v1/academic-years)
          year_id=$(echo "$year" | jq -er '.data.id')
          class=$(curl --fail --silent --show-error -b "$RUNNER_TEMP/cookies.txt" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"Section A\",\"grade_level\":\"9\",\"academic_year_id\":\"$year_id\"}" \
            http://localhost:8080/api/v1/classes)
          class_id=$(echo "$class" | jq -er '.data.id')
          student=$(curl --fail --silent --show-error -b "$RUNNER_TEMP/cookies.txt" \
            -H 'Content-Type: application/json' \
            -d "{\"student_number\":\"CI-001\",\"legal_name\":\"Test Learner\",\"class_id\":\"$class_id\"}" \
            http://localhost:8080/api/v1/students)
          student_id=$(echo "$student" | jq -er '.data.id')
          curl --fail --silent --show-error -b "$RUNNER_TEMP/cookies.txt" \
            "http://localhost:8080/api/v1/students/$student_id" | jq -e '.data.legal_name == "Test Learner"'
      - name: Build web application
        working-directory: apps/web
        run: npm ci && npm run build
