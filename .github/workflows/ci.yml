name: Build and smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: furii
          POSTGRES_USER: furii
          POSTGRES_PASSWORD: furii-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U furii -d furii"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://furii:furii-ci-password@localhost:5432/furii?sslmode=disable
      SESSION_HASH_KEY: ci-only-session-hash-key-at-least-32-bytes
      HTTP_ADDR: :8080
      COOKIE_SECURE: "false"
      BOOTSTRAP_SCHOOL_NAME: FURII CI School
      BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      BOOTSTRAP_ADMIN_NAME: CI Administrator
      BOOTSTRAP_ADMIN_PASSWORD: ci-test-password-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build API
        working-directory: services/api
        run: go mod tidy && go build ./...
      - name: Apply database migrations
        working-directory: services/api
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.24.1 -dir migrations postgres "$DATABASE_URL" up
      - name: Bootstrap administrator
        working-directory: services/api
        run: go run ./cmd/bootstrap
      - name: Start API and smoke test administrator school setup
        working-directory: services/api
        run: |
          go run ./cmd/api > "$RUNNER_TEMP/furii-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://localhost:8080/healthz >/dev/null; then cat "$RUNNER_TEMP/furii-api.log"; echo '::error title=FURII smoke test::API health check failed'; exit 1; fi
          api_request() {
            method="$1"; path="$2"; payload="${3:-}"
            if [ -n "$payload" ]; then
              status=$(curl --silent --show-error -o "$RUNNER_TEMP/response.json" -w '%{http_code}' -b "$RUNNER_TEMP/cookies.txt" -c "$RUNNER_TEMP/cookies.txt" -X "$method" -H 'Content-Type: application/json' -d "$payload" "http://localhost:8080$path") || { echo "::error title=FURII smoke test::Transport failure for $method $path"; return 1; }
            else
              status=$(curl --silent --show-error -o "$RUNNER_TEMP/response.json" -w '%{http_code}' -b "$RUNNER_TEMP/cookies.txt" "http://localhost:8080$path") || { echo "::error title=FURII smoke test::Transport failure for $method $path"; return 1; }
            fi
            case "$status" in 2*) cat "$RUNNER_TEMP/response.json" ;; *) body=$(cat "$RUNNER_TEMP/response.json"); echo "::error title=FURII smoke test::$method $path returned HTTP $status: $body"; return 1 ;; esac
          }
          login=$(curl --silent --show-error -o "$RUNNER_TEMP/login.json" -w '%{http_code}' -c "$RUNNER_TEMP/cookies.txt" \
            -H 'Content-Type: application/json' -d '{"email":"admin@example.test","password":"ci-test-password-long-enough"}' http://localhost:8080/api/v1/auth/login)
          if [ "$login" != "200" ]; then body=$(cat "$RUNNER_TEMP/login.json"); echo "::error title=FURII smoke test::POST /api/v1/auth/login returned HTTP $login: $body"; exit 1; fi
          school=$(api_request GET /api/v1/school)
          if ! echo "$school" | jq -e '.data.name == "FURII CI School"'; then echo "::error title=FURII smoke test::Unexpected school response: $school"; exit 1; fi
          school=$(api_request PATCH /api/v1/school '{"name":"FURII CI School","timezone":"Africa/Addis_Ababa","default_language":"en"}')
          year=$(api_request POST /api/v1/academic-years '{"name":"2026-2027","starts_on":"2026-09-01","ends_on":"2027-07-01"}')
          if ! year_id=$(echo "$year" | jq -er '.data.id'); then echo "::error title=FURII smoke test::Unexpected academic-year response: $year"; exit 1; fi
          class=$(api_request POST /api/v1/classes "{\"name\":\"Section A\",\"grade_level\":\"9\",\"academic_year_id\":\"$year_id\"}")
          if ! class_id=$(echo "$class" | jq -er '.data.id'); then echo "::error title=FURII smoke test::Unexpected class response: $class"; exit 1; fi
          student=$(api_request POST /api/v1/students "{\"student_number\":\"CI-001\",\"legal_name\":\"Test Learner\",\"class_id\":\"$class_id\"}")
          if ! student_id=$(echo "$student" | jq -er '.data.id'); then echo "::error title=FURII smoke test::Unexpected student response: $student"; exit 1; fi
          fetched=$(api_request GET "/api/v1/students/$student_id")
          if ! echo "$fetched" | jq -e '.data.legal_name == "Test Learner"'; then echo "::error title=FURII smoke test::Unexpected student detail response: $fetched"; exit 1; fi
          updated=$(api_request PATCH "/api/v1/students/$student_id" '{"legal_name":"Test Learner Updated","preferred_language":"en","status":"active"}')
          if ! echo "$updated" | jq -e '.data.legal_name == "Test Learner Updated"'; then echo "::error title=FURII smoke test::Unexpected updated-student response: $updated"; exit 1; fi
          api_request POST "/api/v1/students/$student_id/academic-records" '{"school_name":"Previous School","academic_year_label":"2024-2025","grade_level":"8","subject_name":"Mathematics","score":85,"maximum_score":100,"grade_label":"B","source_type":"staff_entry"}' >/dev/null
          records=$(api_request GET "/api/v1/students/$student_id/academic-records")
          if ! echo "$records" | jq -e 'any(.data[]; .subject_name == "Mathematics" and .score == 85)'; then echo "::error title=FURII smoke test::Academic record was not returned: $records"; exit 1; fi
          api_request POST "/api/v1/students/$student_id/external-exams" '{"exam_name":"IELTS","exam_provider":"British Council","exam_date":"2026-09-01","score":7.5,"maximum_score":9,"breakdowns":[{"section_name":"Reading","score":8,"maximum_score":9}]}' >/dev/null
          exams=$(api_request GET "/api/v1/students/$student_id/external-exams")
          if ! echo "$exams" | jq -e 'any(.data[]; .exam_name == "IELTS" and .breakdowns[0].section_name == "Reading")'; then echo "::error title=FURII smoke test::External exam breakdown was not returned: $exams"; exit 1; fi
          printf 'student_number,school_name,academic_year_label,grade_level,subject_name,score,maximum_score,grade_label,source_type\nCI-001,Prior School,2023-2024,Grade 8,English,78,100,C,school_import\n' > "$RUNNER_TEMP/academic-records.csv"
          preview_status=$(curl --silent --show-error -o "$RUNNER_TEMP/import-preview.json" -w '%{http_code}' -b "$RUNNER_TEMP/cookies.txt" -H 'Content-Type: text/csv' --data-binary @"$RUNNER_TEMP/academic-records.csv" http://localhost:8080/api/v1/import-jobs/preview)
          if [ "$preview_status" != "201" ]; then body=$(cat "$RUNNER_TEMP/import-preview.json"); echo "::error title=FURII smoke test::CSV preview returned HTTP $preview_status: $body"; exit 1; fi
          job_id=$(jq -er '.data.id' "$RUNNER_TEMP/import-preview.json")
          imported=$(api_request POST "/api/v1/import-jobs/$job_id/commit" '{}')
          if ! echo "$imported" | jq -e '.data.status == "committed" and .data.imported_rows == 1'; then echo "::error title=FURII smoke test::CSV commit failed: $imported"; exit 1; fi
          curriculum=$(api_request POST "/api/v1/curricula" '{"name":"Ethiopian Curriculum","provider":"Ministry of Education","country_code":"ET","version_label":"CI","language_code":"en","source_reference":"CI fixture","license_notes":"CI only"}')
          curriculum_id=$(echo "$curriculum" | jq -er '.data.id')
          subject=$(api_request POST "/api/v1/curricula/$curriculum_id/subjects" '{"name":"Mathematics","grade_level":"8","subject_code":"MATH-8"}')
          subject_id=$(echo "$subject" | jq -er '.data.id')
          skill=$(api_request POST "/api/v1/subjects/$subject_id/nodes" '{"node_type":"skill","title":"Add fractions","code":"M8.1"}')
          skill_id=$(echo "$skill" | jq -er '.data.id')
          question=$(api_request POST "/api/v1/questions" "{\"question_type\":\"single_choice\",\"prompt\":{\"text\":\"What is 1/2 + 1/4?\"},\"options\":[{\"id\":\"A\",\"text\":\"3/4\"},{\"id\":\"B\",\"text\":\"2/6\"}],\"answer_key\":[\"A\"],\"difficulty\":2,\"language_code\":\"en\",\"source_name\":\"CI fixture\",\"source_reference\":\"CI only\",\"license_notes\":\"CI fixture, not for distribution\",\"skill_tags\":[{\"skill_id\":\"$skill_id\",\"weight\":1}]}" )
          question_id=$(echo "$question" | jq -er '.data.id')
          published=$(api_request POST "/api/v1/questions/$question_id/publish" '{}')
          if ! echo "$published" | jq -e '.data.status == "published"'; then echo "::error title=FURII smoke test::Question did not publish: $published"; exit 1; fi
          question_bank=$(api_request GET "/api/v1/questions")
          if ! echo "$question_bank" | jq -e --arg id "$question_id" 'any(.data[]; .id == $id and .status == "published" and (has("answer_key") | not) and .skill_tags[0].title == "Add fractions")'; then echo "::error title=FURII smoke test::Published question is missing or answer key was exposed: $question_bank"; exit 1; fi
      - name: Build web application
        working-directory: apps/web
        run: npm ci && npm run build
