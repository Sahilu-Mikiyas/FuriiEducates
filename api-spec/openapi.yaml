openapi: 3.1.0
info:
  title: FURII School OS API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Create an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200': { description: Authenticated; sets an HttpOnly session cookie }
        '400': { description: Invalid request }
        '401': { description: Invalid credentials }
        '429': { description: Too many attempts from this address, or too many failed attempts for this account (RATE_LIMITED); see Retry-After }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '200': { description: Session revoked }
  /me:
    get:
      summary: Get the current identity and roles
      description: Includes platform_operator, which is true for school administrators listed in DEMO_REQUEST_ADMIN_EMAILS, and default_language, the school's default language.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Authentication required }
  /prep/bank:
    get:
      summary: Count each national exam paper's questions (staff)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /prep/questions:
    get:
      summary: List exam questions. Teachers see answers only for questions they wrote (staff)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
    post:
      summary: Save a four-option exam question as a draft (staff)
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Success }
        '401': { description: Authentication required }
  /prep/questions/import:
    post:
      summary: Import a CSV of exam questions as drafts. Any bad row saves nothing and returns row_errors (staff)
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Success }
        '401': { description: Authentication required }
  /prep/questions/approve:
    post:
      summary: Approve draft exam questions (administrator)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /prep/questions/{questionID}/reject:
    post:
      summary: Reject a draft exam question (administrator)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /prep/mock-papers:
    post:
      summary: Draft a school mock paper from approved questions, using exam-only questions first (administrator)
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Success }
        '401': { description: Authentication required }
  /prep/students/{studentID}/stream:
    put:
      summary: Set a student's natural or social science stream (administrator)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /prep/classes/{classID}/stream:
    put:
      summary: Set the stream of every student in a class (administrator)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /prep/classes/{classID}/readiness:
    get:
      summary: Class readiness estimates and topic results (administrator or assigned teacher)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /prep/readiness:
    get:
      summary: School readiness by stream and class (administrator)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /student/prep:
    get:
      summary: The student's exam prep home: stream, papers, readiness, open practice and mocks
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /student/prep/onboarding:
    post:
      summary: Record that the student finished the computer-skills lessons
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /student/prep/sessions:
    post:
      summary: Start a drill, weak-topic, review or timed practice sitting
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Success }
        '401': { description: Authentication required }
  /student/prep/sessions/{sessionID}:
    get:
      summary: Read a sitting. Answers appear after each answer in practice and only after finishing on a timed paper
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /student/prep/sessions/{sessionID}/answers/{questionID}:
    put:
      summary: Save an answer and flag. Practice replies with the explanation; the first practice answer stands
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /student/prep/sessions/{sessionID}/finish:
    post:
      summary: Finish and grade a sitting
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /student/prep/mocks:
    post:
      summary: Open a full mock exam for the student's stream, or return the one already open
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Success }
        '401': { description: Authentication required }
  /student/prep/mocks/{mockID}/papers:
    post:
      summary: Start or resume one timed paper of a full mock exam
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Success }
        '401': { description: Authentication required }
  /student/prep/packs:
    post:
      summary: Download practice questions with their answers for offline use. Never includes exam-only questions
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Success }
        '401': { description: Authentication required }
  /student/prep/offline-sittings:
    post:
      summary: Upload practice done offline. The server marks it, and repeating an upload with the same client_id changes nothing
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Recorded }
        '200': { description: Already recorded }
        '401': { description: Authentication required }
  /prep/mock-rounds:
    get:
      summary: List mock days with their timetable and results summary. Teachers see only their classes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
    post:
      summary: Schedule a mock day, creating one paper per subject for the chosen classes (administrator)
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Created }
        '401': { description: Authentication required }
        '409': { description: A paper has too few approved questions }
  /prep/mock-rounds/{roundID}/results:
    get:
      summary: Results by student, stream, class and paper. Teachers see only their classes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
  /prep/mock-rounds/{roundID}/reschedule:
    post:
      summary: Move a paper that no student has started (administrator)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
        '409': { description: Students have started this paper }
  /prep/mock-rounds/{roundID}/cancel:
    post:
      summary: Cancel a mock day that no student has started (administrator)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '401': { description: Authentication required }
        '409': { description: Students have started this mock day }
  /demo-requests:
    post:
      summary: Submit a public school setup request
      description: Stores school preferences and contact details for product review; no workspace or account is created until a configured FURII operator prepares it. Do not include learner information. Repeat submissions from an email are throttled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, school_name, role, school_size, timezone, region, default_language, priorities, contact_consent]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                school_name: { type: string, minLength: 2, maxLength: 180 }
                role: { type: string, minLength: 2, maxLength: 80 }
                school_size: { type: string, enum: [1-100, 101-500, 501-1500, 1501+] }
                timezone: { type: string, description: IANA timezone name }
                region: { type: string, minLength: 2, maxLength: 80 }
                default_language: { type: string, minLength: 2, maxLength: 16 }
                priorities:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  items: { type: string, enum: [student-records, curriculum, assessment, learning-progress, staff-coordination, academic-history, family-communication] }
                message: { type: string, maxLength: 3000 }
                contact_consent: { type: boolean, const: true }
                website: { type: string, description: Spam honeypot; leave blank }
      responses:
        '201': { description: Request received }
        '202': { description: Spam honeypot accepted without storing a request }
        '400': { description: Required fields or consent are invalid }
        '429': { description: A recent request already came from this email }
  /platform/demo-requests:
    get:
      summary: List walkthrough requests for the configured FURII operator
      description: Requires a school-admin session and an email in DEMO_REQUEST_ADMIN_EMAILS.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Most recent 100 requests }
        '403': { description: The school administrator is not on the product inbox allowlist }
  /platform/demo-requests/{requestID}:
    parameters:
      - name: requestID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Update a walkthrough request status
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [new, contacted, closed] }
      responses:
        '200': { description: Updated request }
        '400': { description: Invalid request ID or status }
        '403': { description: The school administrator is not on the product inbox allowlist }
        '404': { description: Request not found }
  /platform/demo-requests/{requestID}/prepare:
    parameters:
      - name: requestID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Prepare a school and create its first administrator invitation
      description: Requires a school-admin session and an email in DEMO_REQUEST_ADMIN_EMAILS. Creates the school and setup profile in one transaction, returns a seven-day one-time token once, and marks the request as contacted.
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: School, setup profile, and one-time invitation created }
        '200': { description: A pending administrator invite was renewed and its previous token invalidated }
        '400': { description: Invalid request ID }
        '403': { description: Not an allowed product operator }
        '404': { description: Request not found }
        '409': { description: Request is closed, email already has an account or pending invite, or its invite was already claimed }
  /school/setup-profile:
    get:
      summary: Read the school setup choices saved before administrator signup
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Learner count, region, and priorities chosen during school setup }
  /healthz:
    get:
      summary: API and database health
      responses:
        '200': { description: Healthy }
        '503': { description: Dependency unavailable }
  /school:
    get:
      summary: Read the current school profile
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: School profile }
    patch:
      summary: Update school settings
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Updated school profile }
  /school/learning-summary:
    get:
      summary: Read school-scoped assessment and intervention summary
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Assessment completion, average objective score, and active recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assigned_assessments: { type: integer }
                      submitted_attempts: { type: integer }
                      average_score_percent: { type: number }
                      active_recommendations: { type: integer }
  /academic-years:
    get:
      summary: List academic years for the current school
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Academic years }
    post:
      summary: Create an academic year
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Academic year created }
  /classes:
    get:
      summary: List classes for the current school
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Classes }
    post:
      summary: Create a class in an academic year
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Class created }
  /students:
    get:
      summary: List students in the current school
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Students }
    post:
      summary: Create a student and optionally enroll in a class
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Student created }
  /students/{studentID}:
    parameters:
      - name: studentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a student in the current school
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Student }
        '404': { description: Student not found }
    patch:
      summary: Update a student's permitted profile fields
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Updated student }
        '404': { description: Student not found }
  /students/{studentID}/academic-records:
    parameters:
      - name: studentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List previous academic records
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Academic history records }
    post:
      summary: Add a historical school result
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Academic record created }
  /students/{studentID}/external-exams:
    parameters:
      - name: studentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List external examination results and section breakdowns
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: External exam history }
    post:
      summary: Add an external examination result
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: External exam result created }
  /import-jobs/preview:
    post:
      summary: Validate an academic records CSV without importing it
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '201': { description: Preview with valid row count and row errors }
        '400': { description: Malformed CSV or header }
        '413': { description: File exceeds size or row limit }
  /import-jobs/{jobID}:
    parameters:
      - name: jobID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a school-scoped academic import preview
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Preview status and row errors }
        '404': { description: Import job not found }
  /import-jobs/{jobID}/commit:
    parameters:
      - name: jobID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Commit a clean academic import preview exactly once
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Import committed }
        '409': { description: Preview contains errors or has already been committed }
  /curricula:
    get:
      summary: List curriculum versions
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Curriculum definitions and source metadata }
    post:
      summary: Create a curriculum version
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Curriculum created }
  /curricula/{curriculumID}/subjects:
    parameters:
      - name: curriculumID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List subjects in a curriculum version
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Subjects }
    post:
      summary: Add a subject and grade to a curriculum version
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Subject created }
  /subjects/{subjectID}/nodes:
    parameters:
      - name: subjectID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Browse curriculum units, topics, concepts, skills, and objectives
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Curriculum hierarchy nodes }
    post:
      summary: Add a curriculum hierarchy node
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Node created }
  /curriculum-mappings:
    get:
      summary: List reviewed mappings between curriculum nodes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Reviewed cross-curriculum mappings }
  /curriculum-mappings/review:
    post:
      summary: Create or update a reviewed mapping between curriculum nodes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Reviewed mapping saved }
  /questions:
    get:
      summary: List school question-bank content without answer keys
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Questions, source metadata, and skill tags }
    post:
      summary: Create a question draft with skill tags
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Draft created }
  /questions/{questionID}:
    parameters:
      - name: questionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a question without its server-side answer key
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Question and tags }
        '404': { description: Question not found }
    patch:
      summary: Replace a draft question and its skill tags
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Draft updated }
        '409': { description: Only drafts can be changed }
  /questions/{questionID}/publish:
    parameters:
      - name: questionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Validate provenance and skill weights, then publish a question
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Question published }
        '409': { description: Question is missing required publication metadata or tags }
  /assessments:
    get:
      summary: List school assessments with question and class assignments
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Assessments scoped to the current school }
    post:
      summary: Create a draft assessment from published school questions
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, duration_minutes, question_ids]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                instructions: { type: string, maxLength: 5000 }
                duration_minutes: { type: integer, minimum: 5, maximum: 240 }
                shuffle_questions: { type: boolean, description: Give each attempt its own question order }
                shuffle_options: { type: boolean, description: Give each attempt its own answer-choice order }
                locked_mode: { type: boolean, description: Full-screen page that reports leaving the exam window }
                question_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        '201': { description: Draft assessment created }
        '400': { description: Invalid request or question is not published in this school }
  /assessments/{assessmentID}/publish:
    parameters:
      - name: assessmentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Publish a non-empty draft assessment
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Assessment published }
        '404': { description: Assessment not found }
        '409': { description: Assessment cannot be published }
  /assessments/{assessmentID}/assignments:
    parameters:
      - name: assessmentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Assign a published assessment to a class in the current school
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class_id]
              properties:
                class_id: { type: string, format: uuid }
                opens_at: { type: [string, 'null'], format: date-time }
                due_at: { type: [string, 'null'], format: date-time }
                requires_start_code: { type: boolean, description: Invigilated; students need the code from an open session }
      responses:
        '201': { description: Assessment assigned to the class }
        '404': { description: Assessment or class not found }
        '409': { description: Assessment is unpublished or already assigned }
  /students/{studentID}/invitation:
    parameters:
      - name: studentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Create a one-time account invitation for an active student
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201': { description: Student activation token; return only once }
        '404': { description: Student not found }
  /student-invitations/accept:
    post:
      summary: Accept a one-time student account invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, display_name, password]
              properties:
                token: { type: string }
                display_name: { type: string, minLength: 1, maxLength: 200 }
                password: { type: string, minLength: 12 }
      responses:
        '201': { description: Student account activated }
        '400': { description: Invalid or expired invitation }
  /student/assessments:
    get:
      summary: List published assessments assigned to the current student's active classes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Assigned assessments and attempt status }
  /student/assessments/{assignmentID}:
    parameters:
      - name: assignmentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read the assigned assessment without server-side answer keys
      description: Questions are returned only after the student has started. Before that the response has the question count, duration, and window. An attempt past its deadline and grace window is finalized first.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Assessment summary, and learner-facing questions once started }
        '404': { description: Assessment is not assigned to an active class }
  /student/assessments/{assignmentID}/start:
    parameters:
      - name: assignmentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Start or resume the student's single attempt
      description: A student who already started resumes with no further checks, so closing a session never locks out someone reconnecting.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_code: { type: string, description: Required when the assignment is invigilated }
      responses:
        '201': { description: Attempt created or resumed }
        '403': { description: Wrong start code (START_CODE_INVALID) }
        '404': { description: Not assigned to this student's active class }
        '409': { description: Not open yet (ASSESSMENT_NOT_OPEN), past due (ASSESSMENT_CLOSED), or session not open (SESSION_NOT_OPEN) }
        '429': { description: Too many wrong start codes (RATE_LIMITED) }
  /student/attempts/{attemptID}/answers/{questionID}:
    parameters:
      - name: attemptID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: questionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Save an answer on the student's in-progress attempt
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer, revision, idempotency_key, flagged]
              properties:
                answer: {}
                revision: { type: integer, minimum: 0 }
                idempotency_key: { type: string, format: uuid }
                flagged: { type: boolean }
      responses:
        '200': { description: Answer saved }
        '404': { description: Attempt or question not found }
        '409': { description: Attempt submitted, deadline passed, or stale answer revision }
  /student/attempts/{attemptID}/submit:
    parameters:
      - name: attemptID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Submit answers for server-side automatic grading
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { type: object, additionalProperties: true }
      responses:
        '200': { description: Submission received and objective items graded }
        '409': { description: Attempt was already submitted }
  /teacher/reviews:
    get:
      summary: List unanswered written response reviews for an assigned class
      security: [{ sessionCookie: [] }]
      parameters:
        - name: class_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Pending written responses with prompts and grading guides }
        '403': { description: Teacher is not assigned to the class }
  /teacher/attempts/{attemptID}/answers/{questionID}:
    parameters:
      - name: attemptID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: questionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Grade a written response from a submitted attempt
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: { type: number, minimum: 0 }
                feedback: { type: string, maxLength: 5000 }
      responses:
        '200': { description: Grade saved; final result released when all written answers are reviewed }
        '400': { description: Score is outside the question's point range }
        '403': { description: Teacher is not assigned to the class }
        '404': { description: Attempt or written answer not found }
        '409': { description: Attempt is not submitted }
  /student/learning-profile:
    get:
      summary: Get the current student's skill mastery estimates and recommendations
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Skill estimates include evidence counts, confidence bands, and algorithm version }
  /student/recommendations/{recommendationID}/accept:
    parameters:
      - name: recommendationID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Accept a recommendation owned by the current student
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Recommendation accepted }
        '404': { description: Recommendation not found }
        '409': { description: Recommendation is not pending }
  /student/recommendations/{recommendationID}/complete:
    parameters:
      - name: recommendationID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Mark an accepted recommendation's learning activity complete
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Completion recorded for later reassessment comparison }
        '404': { description: Recommendation not found }
        '409': { description: Recommendation must be accepted first }
  /teacher/classes/{classID}/learning-profile:
    parameters:
      - name: classID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: View skill evidence and active recommendation counts for an assigned class
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Class-scoped learner skill evidence }
        '403': { description: Teacher is not assigned to the class }
  /staff:
    get:
      summary: List teacher accounts and their assigned class IDs
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Teachers in the administrator's school }
        '403': { description: School administrator required }
  /staff/{staffID}:
    parameters:
      - { name: staffID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Enable or disable a teacher account
      description: Disabling revokes every active session for that teacher.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200': { description: Status updated }
        '404': { description: Teacher not found in this school }
  /staff/invitations:
    get:
      summary: List pending, unexpired staff invitations
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Pending invitations }
    post:
      summary: Invite a teacher
      description: Returns a seven-day, single-use token once. Share the link privately; there is no email delivery.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '201': { description: Invitation created, including the one-time token }
        '409': { description: An account or pending invitation already uses this email }
  /staff/invitations/{invitationID}/revoke:
    parameters:
      - { name: invitationID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Revoke a pending staff invitation
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Invitation revoked }
        '404': { description: Pending invitation not found }
  /staff/invitations/accept:
    post:
      summary: Accept a teacher or school administrator invitation
      description: Public endpoint. Creates the account with the role stored on the invitation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, display_name, password]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
                display_name: { type: string, maxLength: 200 }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        '201': { description: Account created }
        '400': { description: Invalid, expired, or used invitation }
        '409': { description: An account already uses this email }
  /classes/{classID}/teachers:
    parameters:
      - { name: classID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Assign an active teacher to a class
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacher_id]
              properties:
                teacher_id: { type: string, format: uuid }
      responses:
        '200': { description: Teacher assigned (idempotent) }
        '404': { description: Class or active teacher not found in this school }
  /teacher/classes:
    get:
      summary: List the signed-in teacher's assigned classes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Assigned classes }
        '403': { description: Teacher account required }
  /teacher/classes/{classID}/students:
    parameters:
      - { name: classID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List active students in an assigned class
      description: Returns an empty list for classes not assigned to the teacher.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Class roster }
  /teacher/lesson-plans:
    get:
      summary: List the signed-in teacher's lesson plans
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Lesson plans, newest lesson date first }
    post:
      summary: Create a lesson plan for an assigned class
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LessonPlanInput' }
      responses:
        '200': { description: Plan saved }
        '400': { description: Invalid plan }
        '403': { description: Class is not assigned to this teacher }
  /teacher/lesson-plans/{planID}:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read one of the signed-in teacher's lesson plans
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Lesson plan }
        '404': { description: Not found }
    put:
      summary: Update a draft or returned lesson plan
      description: Only plans in draft or needs_revision status can be edited. Saving clears any previous review.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LessonPlanInput' }
      responses:
        '200': { description: Plan saved }
        '404': { description: Editable plan not found }
  /lesson-plans:
    get:
      summary: List lesson plans across the school for administrator review
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Lesson plans with teacher and class names }
  /lesson-plans/{planID}/review:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Approve a submitted lesson plan or return it for revision
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, needs_revision] }
      responses:
        '200': { description: Plan reviewed }
        '404': { description: Submitted plan not found }
  /teacher/classes/{classID}/resources:
    parameters:
      - { name: classID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List resources shared with an assigned class
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Resource metadata }
        '403': { description: Class is not assigned to this teacher }
    post:
      summary: Upload a class resource (up to 15 MB)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string, maxLength: 200 }
                description: { type: string }
                subject: { type: string }
      responses:
        '201': { description: Resource stored }
        '403': { description: Class is not assigned to this teacher }
        '413': { description: File is larger than 15 MB }
  /student/resources:
    get:
      summary: List resources shared with the signed-in student's active classes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Resource metadata }
  /resources/{resourceID}/download:
    parameters:
      - { name: resourceID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Download a class resource
      description: Allowed for school administrators, teachers assigned to the class, and students actively enrolled in it.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: File content as an attachment }
        '403': { description: Not shared with this account }
        '404': { description: Resource not found }
  /finance/entries:
    get:
      summary: List the latest 500 finance ledger entries
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Ledger entries }
    post:
      summary: Record a tuition charge, payment, expense, or salary entry
      description: Records activity only; it does not move money. Entries cannot yet be edited or voided after creation.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_type, category, description, amount_minor, currency_code, status]
              properties:
                entry_type: { type: string, enum: [tuition_charge, payment, expense, salary] }
                category: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                amount_minor: { type: integer, minimum: 1, maximum: 1000000000000 }
                currency_code: { type: string, enum: [ETB, USD, EUR] }
                student_id: { type: [string, 'null'], format: uuid, description: Required for tuition charges and payments }
                staff_user_id: { type: [string, 'null'], format: uuid, description: Required for salary entries }
                due_on: { type: [string, 'null'], format: date }
                paid_on: { type: [string, 'null'], format: date }
                status: { type: string, enum: [recorded, paid, void] }
                reference: { type: string }
      responses:
        '201': { description: Entry recorded }
        '400': { description: Invalid entry }
  /finance/summary:
    get:
      summary: Ledger totals in ETB minor units
      description: Entries in other currencies are not included yet.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Totals for tuition, payments, expenses, salaries, and outstanding charges }
  /auth/password:
    post:
      summary: Change the signed-in user's password
      description: Signs out the account's other sessions and cancels unused reset links. The current session stays signed in. Repeated wrong current passwords are rate limited.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        '200': { description: Password changed }
        '400': { description: Current password incorrect (INVALID_CURRENT_PASSWORD) or new password too short }
        '429': { description: Too many failed attempts (RATE_LIMITED) }
  /auth/password-reset/complete:
    post:
      summary: Redeem a one-time password reset link
      description: Public and rate limited per client address. Sets the password, marks the link used, and signs the account out everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
                new_password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        '200': { description: Password changed; returns the account email }
        '400': { description: Link invalid, expired, used, or replaced (RESET_INVALID), or password too short }
        '429': { description: Too many attempts from this address (RATE_LIMITED) }
  /staff/{staffID}/password-reset:
    parameters:
      - { name: staffID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Issue a password reset link for a teacher or another administrator
      description: Returns a 24-hour, single-use token once and cancels earlier unused links for that account. Administrators use Change password for their own account.
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Link issued, including the one-time token }
        '400': { description: Target is the signed-in administrator (USE_CHANGE_PASSWORD) }
        '404': { description: Staff account not found in this school }
        '409': { description: Account is disabled }
  /students/{studentID}/password-reset:
    parameters:
      - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Issue a password reset link for a student's learner account
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Link issued, including the one-time token }
        '404': { description: Student not found in this school }
        '409': { description: Student has no learner account yet, or it is disabled }
  /platform/password-resets:
    post:
      summary: Issue a password reset link for a locked-out school administrator
      description: Platform operators only (email listed in DEMO_REQUEST_ADMIN_EMAILS).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201': { description: Link issued, including the one-time token }
        '403': { description: Not a platform operator }
        '404': { description: No school administrator uses that email }
  /assignments/{assignmentID}:
    parameters:
      - { name: assignmentID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Change when a class assignment opens and closes
      description: Omitted times are cleared. Attempts already started keep their deadlines.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                opens_at: { type: [string, 'null'], format: date-time }
                due_at: { type: [string, 'null'], format: date-time }
      responses:
        '200': { description: Assignment updated }
        '400': { description: Invalid times, or due time is not after the opening time }
        '404': { description: Assignment not found }
  /student/attempts/{attemptID}/integrity-events:
    parameters:
      - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Report a signal from a locked exam page
      description: Signals are for an invigilator to review and are not proof of cheating. Capped at 500 per attempt; finished attempts and other students' attempts return recorded false.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [tab_hidden, window_blur, fullscreen_exit, paste_attempt, copy_attempt] }
      responses:
        '200': { description: Whether the signal was recorded }
        '400': { description: Unknown signal }
  /exam-sessions:
    get:
      summary: List exam sessions the user can invigilate
      description: Administrators see the whole school; teachers see their assigned classes.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Sessions with enrolled, in-progress, and submitted counts }
  /exam-sessions/{assignmentID}:
    parameters:
      - { name: assignmentID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read the invigilator console
      description: Session state, the start code, and each enrolled student's live status.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Session and roster }
        '403': { description: Teacher is not assigned to this class }
        '404': { description: Session not found in this school }
  /exam-sessions/{assignmentID}/open:
    parameters:
      - { name: assignmentID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Open an invigilated session and issue a new start code
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Session open; returns the start code }
        '409': { description: This assignment does not use a start code }
  /exam-sessions/{assignmentID}/close:
    parameters:
      - { name: assignmentID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Close a session so no new students can start
      description: Students who already started can continue and reconnect.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Session closed }
  /exam-sessions/{assignmentID}/attempts/{attemptID}/events:
    parameters:
      - { name: assignmentID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read an attempt's timeline, leaving out routine autosaves
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Events in time order }
  /exam-sessions/{assignmentID}/attempts/{attemptID}/extend:
    parameters:
      - { name: assignmentID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Give one student extra time
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 240 }
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { description: New deadline }
        '404': { description: Student has not started }
        '409': { description: Attempt already submitted }
  /exam-sessions/{assignmentID}/attempts/{attemptID}/finish:
    parameters:
      - { name: assignmentID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: End one student's attempt now, grading saved answers
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Attempt submitted }
        '409': { description: Attempt already submitted }
  /exam-sessions/{assignmentID}/attempts/{attemptID}/incident:
    parameters:
      - { name: assignmentID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Record an incident against a student's attempt
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201': { description: Incident recorded }
        '404': { description: Student has not started }
  /gradebook:
    get:
      summary: Read one result per student per assessment for a class
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: class_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Assessment columns and student rows }
        '400': { description: Missing or malformed class }
        '403': { description: Class is not in this school or not assigned to this teacher }
  /reviews:
    get:
      summary: List written answers awaiting grading in any class of the school
      description: Administrator counterpart of /teacher/reviews, so results are not stuck when a class has no teacher.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: class_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Written answers with grading guides }
  /attempts/{attemptID}/answers/{questionID}/grade:
    parameters:
      - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: questionID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Grade a written answer as a school administrator
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: { type: number, minimum: 0 }
                feedback: { type: string, maxLength: 5000 }
      responses:
        '200': { description: Grade saved; the result is released when nothing remains to grade }
        '404': { description: Written response not found }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: furii_session
  schemas:
    LessonPlanInput:
      type: object
      required: [class_id, subject, lesson_date, duration_minutes, topic, objectives]
      properties:
        class_id: { type: string, format: uuid }
        subject: { type: string }
        lesson_date: { type: string, format: date }
        duration_minutes: { type: integer, minimum: 5, maximum: 480 }
        topic: { type: string, maxLength: 200 }
        objectives: { type: string, maxLength: 5000 }
        prior_knowledge: { type: string }
        materials: { type: string }
        lesson_phases:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              phase: { type: string }
              minutes: { type: integer, minimum: 0 }
              activities: { type: string, maxLength: 2000 }
        differentiation: { type: string }
        assessment: { type: string }
        homework: { type: string }
        reflection: { type: string }
        status: { type: string, enum: [draft, submitted], default: draft }
