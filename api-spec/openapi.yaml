openapi: 3.1.0
info:
  title: FURII School OS API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Create an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200': { description: Authenticated; sets an HttpOnly session cookie }
        '400': { description: Invalid request }
        '401': { description: Invalid credentials }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '200': { description: Session revoked }
  /me:
    get:
      summary: Get the current identity and roles
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Authentication required }
  /demo-requests:
    post:
      summary: Submit a public school setup request
      description: Stores school preferences and contact details for product review; no workspace or account is created until a configured FURII operator prepares it. Do not include learner information. Repeat submissions from an email are throttled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, school_name, role, school_size, timezone, region, default_language, priorities, contact_consent]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                school_name: { type: string, minLength: 2, maxLength: 180 }
                role: { type: string, minLength: 2, maxLength: 80 }
                school_size: { type: string, enum: [1-100, 101-500, 501-1500, 1501+] }
                timezone: { type: string, description: IANA timezone name }
                region: { type: string, minLength: 2, maxLength: 80 }
                default_language: { type: string, minLength: 2, maxLength: 16 }
                priorities:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  items: { type: string, enum: [student-records, curriculum, assessment, learning-progress, staff-coordination, academic-history, family-communication] }
                message: { type: string, maxLength: 3000 }
                contact_consent: { type: boolean, const: true }
                website: { type: string, description: Spam honeypot; leave blank }
      responses:
        '201': { description: Request received }
        '202': { description: Spam honeypot accepted without storing a request }
        '400': { description: Required fields or consent are invalid }
        '429': { description: A recent request already came from this email }
  /platform/demo-requests:
    get:
      summary: List walkthrough requests for the configured FURII operator
      description: Requires a school-admin session and an email in DEMO_REQUEST_ADMIN_EMAILS.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Most recent 100 requests }
        '403': { description: The school administrator is not on the product inbox allowlist }
  /platform/demo-requests/{requestID}:
    parameters:
      - name: requestID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Update a walkthrough request status
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [new, contacted, closed] }
      responses:
        '200': { description: Updated request }
        '400': { description: Invalid request ID or status }
        '403': { description: The school administrator is not on the product inbox allowlist }
        '404': { description: Request not found }
    post:
      summary: Prepare a school and create its first administrator invitation
      description: Requires a school-admin session and an email in DEMO_REQUEST_ADMIN_EMAILS. Creates the school and setup profile in one transaction, returns a seven-day one-time token once, and marks the request as contacted.
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: School, setup profile, and one-time invitation created }
        '200': { description: A pending administrator invite was renewed and its previous token invalidated }
        '400': { description: Invalid request ID }
        '403': { description: Not an allowed product operator }
        '404': { description: Request not found }
        '409': { description: Request is closed, email already has an account or pending invite, or its invite was already claimed }
  /school/setup-profile:
    get:
      summary: Read the school setup choices saved before administrator signup
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Learner count, region, and priorities chosen during school setup }
  /healthz:
    get:
      summary: API and database health
      responses:
        '200': { description: Healthy }
        '503': { description: Dependency unavailable }
  /school:
    get:
      summary: Read the current school profile
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: School profile }
    patch:
      summary: Update school settings
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Updated school profile }
  /school/learning-summary:
    get:
      summary: Read school-scoped assessment and intervention summary
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Assessment completion, average objective score, and active recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assigned_assessments: { type: integer }
                      submitted_attempts: { type: integer }
                      average_score_percent: { type: number }
                      active_recommendations: { type: integer }
  /academic-years:
    get:
      summary: List academic years for the current school
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Academic years }
    post:
      summary: Create an academic year
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Academic year created }
  /classes:
    get:
      summary: List classes for the current school
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Classes }
    post:
      summary: Create a class in an academic year
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Class created }
  /students:
    get:
      summary: List students in the current school
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Students }
    post:
      summary: Create a student and optionally enroll in a class
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Student created }
  /students/{studentID}:
    parameters:
      - name: studentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a student in the current school
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Student }
        '404': { description: Student not found }
    patch:
      summary: Update a student's permitted profile fields
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Updated student }
        '404': { description: Student not found }
  /students/{studentID}/academic-records:
    parameters:
      - name: studentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List previous academic records
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Academic history records }
    post:
      summary: Add a historical school result
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Academic record created }
  /students/{studentID}/external-exams:
    parameters:
      - name: studentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List external examination results and section breakdowns
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: External exam history }
    post:
      summary: Add an external examination result
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: External exam result created }
  /import-jobs/preview:
    post:
      summary: Validate an academic records CSV without importing it
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '201': { description: Preview with valid row count and row errors }
        '400': { description: Malformed CSV or header }
        '413': { description: File exceeds size or row limit }
  /import-jobs/{jobID}:
    parameters:
      - name: jobID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a school-scoped academic import preview
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Preview status and row errors }
        '404': { description: Import job not found }
  /import-jobs/{jobID}/commit:
    parameters:
      - name: jobID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Commit a clean academic import preview exactly once
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Import committed }
        '409': { description: Preview contains errors or has already been committed }
  /curricula:
    get:
      summary: List curriculum versions
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Curriculum definitions and source metadata }
    post:
      summary: Create a curriculum version
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Curriculum created }
  /curricula/{curriculumID}/subjects:
    parameters:
      - name: curriculumID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List subjects in a curriculum version
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Subjects }
    post:
      summary: Add a subject and grade to a curriculum version
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Subject created }
  /subjects/{subjectID}/nodes:
    parameters:
      - name: subjectID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Browse curriculum units, topics, concepts, skills, and objectives
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Curriculum hierarchy nodes }
    post:
      summary: Add a curriculum hierarchy node
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Node created }
  /curriculum-mappings:
    get:
      summary: List reviewed mappings between curriculum nodes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Reviewed cross-curriculum mappings }
  /curriculum-mappings/review:
    post:
      summary: Create or update a reviewed mapping between curriculum nodes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Reviewed mapping saved }
  /questions:
    get:
      summary: List school question-bank content without answer keys
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Questions, source metadata, and skill tags }
    post:
      summary: Create a question draft with skill tags
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Draft created }
  /questions/{questionID}:
    parameters:
      - name: questionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a question without its server-side answer key
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Question and tags }
        '404': { description: Question not found }
    patch:
      summary: Replace a draft question and its skill tags
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Draft updated }
        '409': { description: Only drafts can be changed }
  /questions/{questionID}/publish:
    parameters:
      - name: questionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Validate provenance and skill weights, then publish a question
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Question published }
        '409': { description: Question is missing required publication metadata or tags }
  /assessments:
    get:
      summary: List school assessments with question and class assignments
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Assessments scoped to the current school }
    post:
      summary: Create a draft assessment from published school questions
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, duration_minutes, question_ids]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                instructions: { type: string, maxLength: 5000 }
                duration_minutes: { type: integer, minimum: 5, maximum: 240 }
                question_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        '201': { description: Draft assessment created }
        '400': { description: Invalid request or question is not published in this school }
  /assessments/{assessmentID}/publish:
    parameters:
      - name: assessmentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Publish a non-empty draft assessment
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Assessment published }
        '404': { description: Assessment not found }
        '409': { description: Assessment cannot be published }
  /assessments/{assessmentID}/assignments:
    parameters:
      - name: assessmentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Assign a published assessment to a class in the current school
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class_id]
              properties:
                class_id: { type: string, format: uuid }
      responses:
        '201': { description: Assessment assigned to the class }
        '404': { description: Assessment or class not found }
        '409': { description: Assessment is unpublished or already assigned }
  /students/{studentID}/invitation:
    parameters:
      - name: studentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Create a one-time account invitation for an active student
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201': { description: Student activation token; return only once }
        '404': { description: Student not found }
  /student-invitations/accept:
    post:
      summary: Accept a one-time student account invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, display_name, password]
              properties:
                token: { type: string }
                display_name: { type: string, minLength: 1, maxLength: 200 }
                password: { type: string, minLength: 12 }
      responses:
        '201': { description: Student account activated }
        '400': { description: Invalid or expired invitation }
  /student/assessments:
    get:
      summary: List published assessments assigned to the current student's active classes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Assigned assessments and attempt status }
  /student/assessments/{assignmentID}:
    parameters:
      - name: assignmentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read the assigned assessment without server-side answer keys
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Assessment and learner-facing questions }
        '404': { description: Assessment is not assigned to an active class }
  /student/assessments/{assignmentID}/start:
    parameters:
      - name: assignmentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Start or resume the student's single attempt
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Attempt created or resumed }
  /student/attempts/{attemptID}/answers/{questionID}:
    parameters:
      - name: attemptID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: questionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Save an answer on the student's in-progress attempt
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer, revision, idempotency_key, flagged]
              properties:
                answer: {}
                revision: { type: integer, minimum: 0 }
                idempotency_key: { type: string, format: uuid }
                flagged: { type: boolean }
      responses:
        '200': { description: Answer saved }
        '404': { description: Attempt or question not found }
        '409': { description: Attempt submitted, deadline passed, or stale answer revision }
  /student/attempts/{attemptID}/submit:
    parameters:
      - name: attemptID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Submit answers for server-side automatic grading
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { type: object, additionalProperties: true }
      responses:
        '200': { description: Submission received and objective items graded }
        '409': { description: Attempt was already submitted }
  /teacher/reviews:
    get:
      summary: List unanswered written response reviews for an assigned class
      security: [{ sessionCookie: [] }]
      parameters:
        - name: class_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Pending written responses with prompts and grading guides }
        '403': { description: Teacher is not assigned to the class }
  /teacher/attempts/{attemptID}/answers/{questionID}:
    parameters:
      - name: attemptID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: questionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Grade a written response from a submitted attempt
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: { type: number, minimum: 0 }
                feedback: { type: string, maxLength: 5000 }
      responses:
        '200': { description: Grade saved; final result released when all written answers are reviewed }
        '400': { description: Score is outside the question's point range }
        '403': { description: Teacher is not assigned to the class }
        '404': { description: Attempt or written answer not found }
        '409': { description: Attempt is not submitted }
  /student/learning-profile:
    get:
      summary: Get the current student's skill mastery estimates and recommendations
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Skill estimates include evidence counts, confidence bands, and algorithm version }
  /student/recommendations/{recommendationID}/accept:
    parameters:
      - name: recommendationID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Accept a recommendation owned by the current student
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Recommendation accepted }
        '404': { description: Recommendation not found }
        '409': { description: Recommendation is not pending }
  /student/recommendations/{recommendationID}/complete:
    parameters:
      - name: recommendationID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Mark an accepted recommendation's learning activity complete
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Completion recorded for later reassessment comparison }
        '404': { description: Recommendation not found }
        '409': { description: Recommendation must be accepted first }
  /teacher/classes/{classID}/learning-profile:
    parameters:
      - name: classID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: View skill evidence and active recommendation counts for an assigned class
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Class-scoped learner skill evidence }
        '403': { description: Teacher is not assigned to the class }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: furii_session
