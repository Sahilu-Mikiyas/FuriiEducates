services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: furii
      POSTGRES_USER: furii
      POSTGRES_PASSWORD: furii-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - furii-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furii -d furii"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  furii-postgres:
